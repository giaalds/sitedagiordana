                Tique: 0, Hécate: 0, Belona: 0, Ênio: 0
            };
        }

        function mostrarPergunta() {
            document.getElementById("progresso").innerText = `Pergunta ${perguntaAtual + 1} de ${perguntas.length}`;
            const elementoPergunta = document.getElementById("pergunta");
            const divOpcoes = document.getElementById("opcoes");

            divOpcoes.innerHTML = "";
            const pergunta = perguntas[perguntaAtual];
            elementoPergunta.innerText = pergunta.texto;

            pergunta.opcoes.forEach(opcao => {
                const botao = document.createElement("button");
                botao.className = "opcao-btn";
                botao.innerHTML = `<span class="deus-tag">${opcao.tag}</span> <span>${opcao.texto}</span>`;
                botao.onclick = () => responder(opcao.deus);
                divOpcoes.appendChild(botao);
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function responder(deus) {
            pontos[deus] = (pontos[deus] || 0) + 1;
            perguntaAtual++;

            if (perguntaAtual < perguntas.length) {
                mostrarPergunta();
            } else {
                mostrarResultado();
            }
        }

        function mostrarResultado() {
            document.getElementById("quiz-box").classList.add("escondido");
            document.getElementById("resultado-box").classList.remove("escondido");

            let deusVencedor = Object.keys(pontos).reduce((a, b) => pontos[a] > pontos[b] ? a : b);
            
            document.getElementById("resultado-deus").innerText = deusVencedor + "!";
            document.getElementById("resultado-texto").innerHTML = deusesInfo[deusVencedor] || "Você tem uma conexão única com os deuses!";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reiniciar() {
            zerarPontos();
            perguntaAtual = 0;
            document.getElementById("resultado-box").classList.add("escondido");
            document.getElementById("quiz-box").classList.remove("escondido");
            mostrarPergunta();
        }

        // Inicialização
        zerarPontos();
        mostrarPergunta();
